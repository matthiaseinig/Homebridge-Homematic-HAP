<!--
  Custom UI for homebridge-homematic-hap.

  homebridge-config-ui-x renders this inside a sandboxed iframe and
  injects Bootstrap 5 CSS + a `homebridge.*` global. It does NOT
  inject Bootstrap JS, so we build modals, dropdowns and toggles in
  vanilla CSS/JS — never call `new bootstrap.Modal(...)`.

  Per the plugin-ui-utils contract we omit <html>/<head>/<body>.
-->

<style>
  /*
    Theming policy: every color is sourced from a Bootstrap 5 CSS
    variable (set on :root / [data-bs-theme="dark"] by the host).
    NO hardcoded color fallbacks — when the host flips to dark mode
    the host updates --bs-body-bg, --bs-body-color, --bs-border-color
    et al, and our chrome follows automatically.

    Tiles and cards use transparent backgrounds with a translucent
    border so they read on both light and dark backgrounds without
    needing an explicit fill.
  */

  /* App chrome ----------------------------------------------------- */
  #hgui-app { display: flex; flex-direction: column; min-height: 100vh; color: var(--bs-body-color); }
  .hgui-header { display: flex; gap: 0.5rem; align-items: center; padding: 0.75rem 0; flex-wrap: wrap; }
  .hgui-header .hgui-brand { font-weight: 600; }
  .hgui-header .hgui-version { color: var(--bs-secondary-color); font-size: 0.8rem; }
  .hgui-main { flex: 1; min-width: 0; }

  .hgui-toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; padding: 0.75rem 0; border-top: 1px solid var(--bs-border-color-translucent); border-bottom: 1px solid var(--bs-border-color-translucent); position: sticky; top: 0; background: var(--bs-body-bg); z-index: 10; }
  .hgui-toolbar .form-control, .hgui-toolbar .form-select { max-width: 280px; }
  .hgui-toolbar input.form-control { min-width: 200px; }

  /* Sub-view footer: sticky button bar with NO background fill — the
     border alone is enough; a fill clashes with both the page bg in
     dark mode and the tiles above. */
  .hgui-floating-bar { position: sticky; bottom: 0; background: transparent; padding: 0.75rem 0; border-top: 1px solid var(--bs-border-color-translucent); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  /* Tiles ---------------------------------------------------------- */
  /* Tile min-width drives how many fit per row. The iframe is hosted
     inside Bootstrap's modal-xl (1140 px); 280 px gives ~3 tiles per
     row at full width and degrades gracefully on narrower viewports. */
  .hgui-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; padding: 0.75rem 0; }
  /* --bs-tertiary-bg adapts: a near-white in light mode (#f8f9fa)
     and a slightly-lighter dark in dark mode (#2b3035). Gives tiles
     subtle separation from the page background in either theme. */
  .hgui-tile { background: var(--bs-tertiary-bg); color: var(--bs-body-color); border: 1px solid var(--bs-border-color-translucent); border-radius: 8px; padding: 0.85rem 1rem; display: grid; grid-template-rows: auto auto auto auto; gap: 0.35rem; }
  /* Mute the textual content of un-configured tiles, but keep the
     action button (the "+ Add") at full opacity so it's obvious it
     can be clicked. CSS opacity is multiplicative through the tree,
     so we dim individual children rather than the whole tile. */
  .hgui-tile.muted .hgui-tile-name,
  .hgui-tile.muted .hgui-tile-sub,
  .hgui-tile.muted .hgui-tile-meta,
  .hgui-tile.muted .hgui-tile-pills { opacity: 0.6; }
  .hgui-tile-head { display: flex; align-items: flex-start; gap: 0.5rem; }
  .hgui-tile-name { font-weight: 600; font-size: 1rem; flex: 1; min-width: 0; word-break: break-word; color: var(--bs-body-color); }
  .hgui-tile-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
  .hgui-tile-sub  { color: var(--bs-secondary-color); font-size: 0.875rem; }
  /* tile-meta is the address line. The `<code>` wrapped on the
     address picks up Bootstrap's --bs-code-color (a pinkish red) in
     both themes; the type after the dot stays in secondary color. */
  .hgui-tile-meta { font-size: 0.78rem; color: var(--bs-secondary-color); word-break: break-all; }
  .hgui-tile-meta code { font-size: 0.82rem; }
  .hgui-tile-pills { display: flex; gap: 0.35rem; flex-wrap: wrap; }

  /* Pills are outline-only so they read calmly in either theme without
     the loud opaque fill. The colored variants take their accent from
     Bootstrap's --bs-primary/--bs-success/--bs-warning tokens. */
  .hgui-pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.72rem; background: transparent; color: var(--bs-secondary-color); white-space: nowrap; border: 1px solid var(--bs-border-color); }
  .hgui-pill.primary  { color: var(--bs-primary);  border-color: var(--bs-primary); }
  .hgui-pill.success  { color: var(--bs-success);  border-color: var(--bs-success); }
  .hgui-pill.warning  { color: var(--bs-warning);  border-color: var(--bs-warning); }
  .hgui-pill.muted    { border-style: dashed; color: var(--bs-secondary-color); }

  /* Bridge tile (slightly different shape) -------------------------- */
  .hgui-bridge-tile .hgui-tile-actions { flex-wrap: wrap; }

  /* Empty / pager -------------------------------------------------- */
  .hgui-empty { color: var(--bs-secondary-color); font-style: italic; padding: 2rem; text-align: center; border: 1px dashed var(--bs-border-color-translucent); border-radius: 8px; margin-top: 1rem; }
  .hgui-pager { display: flex; gap: 0.25rem; align-items: center; justify-content: center; padding: 0.75rem 0; flex-wrap: wrap; }

  /* Cards (used in dashboard / settings) --------------------------- */
  .hgui-card { background: var(--bs-tertiary-bg); color: var(--bs-body-color); border: 1px solid var(--bs-border-color-translucent); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
  .hgui-card h6 { margin-bottom: 0.5rem; }
  .hgui-meta { color: var(--bs-secondary-color); font-size: 0.85rem; }

  /* Form rows ------------------------------------------------------ */
  .hgui-form-row { display: grid; grid-template-columns: 130px 1fr; gap: 0.75rem; margin-bottom: 0.85rem; align-items: start; }
  @media (max-width: 700px) { .hgui-form-row { grid-template-columns: 1fr; } }
  .hgui-form-row label { padding-top: 0.5rem; font-weight: 500; color: var(--bs-body-color); }
  .hgui-form-row .hgui-hint { color: var(--bs-secondary-color); font-size: 0.825rem; margin-top: 0.25rem; }
</style>

<div id="hgui-app">

  <!-- Header: view dropdown + persistent action buttons --------------- -->
  <header class="hgui-header">
    <select id="hgui-view-select" class="form-select form-select-sm" style="min-width: 200px; max-width: 220px">
      <option value="dashboard">📊 Dashboard</option>
      <option value="channels">💡 Channels</option>
      <option value="variables">🔢 Variables</option>
      <option value="programs">▶️ Programs</option>
      <option value="bridges">🌉 Bridges</option>
      <option value="import">📥 Import</option>
      <option value="settings">⚙️ Settings</option>
    </select>
    <button id="hgui-discover-btn" class="btn btn-primary btn-sm">Discover</button>
    <button id="hgui-test-btn" class="btn btn-outline-secondary btn-sm">Test CCU</button>
    <span id="hgui-test-result" class="small"></span>
    <span class="hgui-version ms-auto" id="hgui-version-banner"></span>
  </header>

  <main class="hgui-main">
    <div id="hgui-view-host"></div>
  </main>
</div>

<script type="module" src="app.js"></script>
