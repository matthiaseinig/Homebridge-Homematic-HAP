<!--
  Custom UI for homebridge-homematic-hap.

  Layout convention: homebridge-config-ui-x renders this inside a
  sandboxed iframe and injects Bootstrap 5 + a `homebridge.*` global.
  We deliberately omit <html>/<head>/<body> per the plugin-ui-utils
  contract.
-->

<style>
  /* App chrome ----------------------------------------------------- */
  .hgui-app { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; min-height: 600px; }
  @media (max-width: 768px) { .hgui-app { grid-template-columns: 1fr; } }
  .hgui-side { background: var(--bs-tertiary-bg, #f8f9fa); border-radius: 8px; padding: 0.75rem; position: sticky; top: 0.5rem; align-self: start; }
  .hgui-nav-link { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.75rem; border-radius: 6px; cursor: pointer; user-select: none; color: var(--bs-body-color); }
  .hgui-nav-link:hover { background: var(--bs-secondary-bg, #e9ecef); }
  .hgui-nav-link.active { background: var(--bs-primary, #0d6efd); color: #fff; }
  .hgui-nav-badge { margin-left: auto; font-size: 0.75rem; background: var(--bs-secondary-bg, #e9ecef); color: var(--bs-body-color); padding: 0.1rem 0.45rem; border-radius: 999px; }
  .hgui-nav-link.active .hgui-nav-badge { background: rgba(255,255,255,0.25); color: #fff; }
  .hgui-main { min-width: 0; }
  .hgui-toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .hgui-toolbar .form-control { max-width: 320px; }
  .hgui-floating-bar { position: sticky; bottom: 0; background: var(--bs-body-bg); padding: 0.75rem 0; border-top: 1px solid var(--bs-border-color, #ddd); z-index: 5; display: flex; gap: 0.5rem; align-items: center; }

  /* Grid ----------------------------------------------------------- */
  .hgui-grid { width: 100%; border-collapse: separate; border-spacing: 0; }
  .hgui-grid th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--bs-secondary-color, #6c757d); padding: 0.5rem; border-bottom: 1px solid var(--bs-border-color, #dee2e6); position: sticky; top: 0; background: var(--bs-body-bg); }
  .hgui-grid td { padding: 0.5rem; border-bottom: 1px solid var(--bs-border-color-translucent, #eee); vertical-align: middle; }
  .hgui-grid tr:hover td { background: var(--bs-tertiary-bg, #f8f9fa); }
  .hgui-grid code { font-size: 0.8rem; }
  .hgui-row-actions { display: flex; gap: 0.25rem; justify-content: flex-end; }
  .hgui-empty { color: var(--bs-secondary-color, #6c757d); font-style: italic; padding: 1.5rem; text-align: center; }
  .hgui-meta { color: var(--bs-secondary-color, #6c757d); font-size: 0.85rem; }

  /* Pagination ----------------------------------------------------- */
  .hgui-pager { display: flex; gap: 0.25rem; align-items: center; justify-content: flex-end; margin-top: 0.5rem; flex-wrap: wrap; }
  .hgui-pager button { min-width: 2rem; }

  /* Cards ---------------------------------------------------------- */
  .hgui-card { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color, #e0e0e0); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }

  /* Dialog form rows ---------------------------------------------- */
  .hgui-form-row { display: grid; grid-template-columns: 200px 1fr; gap: 0.75rem; margin-bottom: 0.85rem; align-items: start; }
  @media (max-width: 700px) { .hgui-form-row { grid-template-columns: 1fr; } }
  .hgui-form-row label { padding-top: 0.5rem; font-weight: 500; }
  .hgui-form-row .hgui-hint { color: var(--bs-secondary-color, #6c757d); font-size: 0.825rem; margin-top: 0.25rem; }

  /* Bridge view --------------------------------------------------- */
  .hgui-bridge-card { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 1rem; align-items: center; }
  .hgui-pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: var(--bs-secondary-bg, #e9ecef); color: var(--bs-body-color); }
</style>

<div id="hgui-app" class="hgui-app">
  <!-- Sidebar nav -->
  <aside class="hgui-side">
    <div class="mb-2 text-uppercase small text-muted">homebridge-homematic-hap</div>
    <div data-view="dashboard"  class="hgui-nav-link active">📊 Dashboard</div>
    <div data-view="channels"   class="hgui-nav-link">💡 Channels <span class="hgui-nav-badge" data-count="channels">0</span></div>
    <div data-view="variables"  class="hgui-nav-link">🔢 Variables <span class="hgui-nav-badge" data-count="variables">0</span></div>
    <div data-view="programs"   class="hgui-nav-link">▶️ Programs <span class="hgui-nav-badge" data-count="programs">0</span></div>
    <div data-view="bridges"    class="hgui-nav-link">🌉 Bridges <span class="hgui-nav-badge" data-count="bridges">1</span></div>
    <div data-view="import"     class="hgui-nav-link">📥 Import</div>
    <div data-view="settings"   class="hgui-nav-link">⚙️ Settings</div>
    <hr/>
    <button id="hgui-discover-btn" class="btn btn-primary btn-sm w-100 mb-2">Discover devices</button>
    <button id="hgui-test-btn" class="btn btn-outline-secondary btn-sm w-100">Test CCU</button>
    <div id="hgui-test-result" class="small mt-2"></div>
  </aside>

  <!-- Main area -->
  <main class="hgui-main">
    <div id="hgui-view-host"></div>
    <div class="hgui-floating-bar">
      <button id="hgui-save-btn" class="btn btn-success">Save configuration</button>
      <span id="hgui-save-status" class="ms-2"></span>
      <span class="ms-auto small text-muted" id="hgui-version-banner"></span>
    </div>
  </main>
</div>

<!-- Generic modal host: lazily filled by app.js. We use Bootstrap 5's
     modal element directly so styling matches what Homebridge UI X
     ships. -->
<div class="modal fade" id="hgui-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="hgui-modal-title">Edit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="hgui-modal-body"></div>
      <div class="modal-footer" id="hgui-modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="hgui-modal-ok">Save</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
